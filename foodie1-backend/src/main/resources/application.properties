spring.application.name=foodie1

# 🗄️ MYSQL DATABASE CONFIGURATION
# Sử dụng biến môi trường để bảo mật thông tin database
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER_CLASS_NAME}

# 🔄 JPA & HIBERNATE CONFIGURATION
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.show.sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.generate-ddl=true
#spring.jpa.properties.hibernate.hb2dll.auto=update
spring.jpa.hibernate.ddl-auto=none

# 📝 LOGGING CONFIGURATION
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 🖥️ SERVER CONFIGURATION
server.port=${PORT:8080}  # Port mặc định 8080, có thể override bằng biến môi trường
frontend.url=${FRONTEND_URL}  # URL của frontend (cần thiết cho CORS và OAuth2 redirect)
app.base-url=${APP_BASE_URL}

# 📁 FILE UPLOAD CONFIGURATION
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB  # Kích thước file tối đa
spring.servlet.multipart.max-request-size=20MB  # Kích thước request tối đa
file.upload-dir=uploads  # Thư mục lưu file upload

# 🌐 STATIC RESOURCE MAPPING
spring.mvc.static-path-pattern=/uploads/**  # Map URL /uploads/** đến thư mục uploads
spring.web.resources.add-mappings=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# 🗃️ FLYWAY DATABASE MIGRATION
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 🔐 GOOGLE OAUTH2 CONFIGURATION
# Cấu hình OAuth2 với Google để đăng nhập bằng Google account

# Client ID và Secret từ Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Redirect URI sau khi đăng nhập Google thành công
# ${baseUrl} sẽ được thay thế bằng URL của ứng dụng
spring.security.oauth2.client.registration.google.redirect-uri=${baseUrl}/login/oauth2/code/google

# Scope yêu cầu từ Google (quyền truy cập thông tin user)
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Google OAuth2 Provider URLs
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# Attribute name để lấy thông tin user từ Google
spring.security.oauth2.client.provider.google.user-name-attribute=email

# 📧 EMAIL GMAIL CONFIGURATION
# Cấu hình SMTP để gửi email xác minh tài khoản
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}  # Gmail address
spring.mail.password=${EMAIL_PASSWORD}  # App password (không phải Gmail password)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true